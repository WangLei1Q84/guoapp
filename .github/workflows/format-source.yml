name: Format source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: dart format lib test integration_test test_driver
      - uses: actions/upload-artifact@v4
        with:
          name: dart-formatted-source
          path: lib/downloads_screen.dart
