name: Format source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test integration_test test_driver
      - run: git diff --binary > format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: dart-format-patch
          path: format.patch
          retention-days: 1
